<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2b2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BYD">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>BYD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ONE stylesheet for the whole site -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- ===== METAL SIDEBAR ===== -->
    <nav class="nav" id="nav">
      <div class="brand">B<b>Y</b>D</div>
      <div class="brand-sub">Progressive overload</div>

      <button class="nav-btn active" data-page="workout">
        <span class="led"></span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
        <span class="lbl">Workout</span>
      </button>

      <button class="nav-btn" data-page="presets">
        <span class="led"></span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        <span class="lbl">Presets</span>
      </button>

      <button class="nav-btn" data-page="progress">
        <span class="led"></span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span class="lbl">Progress</span>
      </button>

      <button class="nav-btn" data-page="datalog">
        <span class="led"></span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
        <span class="lbl">Data Log</span>
      </button>

      <button class="nav-btn" data-page="activity">
        <span class="led"></span>
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
        <span class="lbl">Activity</span>
      </button>

      <!-- NEW PAGE BUTTONS GO HERE LATER -->

      <div class="grille"></div>
      <div class="side-session" id="side-session"></div>
    </nav>

    <div class="main">

      <!-- ===== TOP STATUS BAR ===== -->
      <header class="topbar">
        <i class="led-g"></i>
        <span class="lcd-pill">SYSTEM READY</span>
        <span class="top-right"><span id="top-date"></span> &nbsp; DATA</span>
      </header>

      <!-- ===== PAGES ===== -->
      <main class="stage">

        <!-- PAGE 1: WORKOUT -->
        <section class="page active" id="page-workout">
          <div class="module display">
            <div class="mod-bar"><span>Today's session</span><span class="mod-count"><i class="led-a"></i>01 / 05</span></div>
            <div class="lcd">
              <div class="lcd-status"><i class="led-g"></i>Session live</div>
              <h1>Workout</h1>
              <div class="lcd-sub lcd-date"></div>
            </div>
          </div>
          <div id="workout-root"></div>
        </section>

        <!-- PAGE 2: PRESETS -->
        <section class="page" id="page-presets">
          <div class="module display">
            <div class="mod-bar"><span>Build your days</span><span class="mod-count"><i class="led-a"></i>02 / 05</span></div>
            <div class="lcd">
              <div class="lcd-status"><i class="led-g"></i>Library</div>
              <h1>Presets</h1>
              <div class="lcd-sub lcd-date"></div>
            </div>
          </div>

          <div class="card new-preset">
            <input class="input" id="preset-name" placeholder="New preset name (e.g. Chest)" maxlength="50">
            <button class="btn primary" id="preset-create">Create</button>
          </div>

          <div id="presets-root"></div>
        </section>

        <!-- PAGE 3: PROGRESS -->
        <section class="page" id="page-progress">
          <div class="module display">
            <div class="mod-bar"><span>Overload tracker</span><span class="mod-count"><i class="led-a"></i>03 / 05</span></div>
            <div class="lcd">
              <div class="lcd-status"><i class="led-g"></i>Analysis</div>
              <h1>Progress</h1>
              <div class="lcd-sub lcd-date"></div>
            </div>
          </div>
          <div id="progress-root"></div>
        </section>

        <!-- PAGE 4: DATA LOG -->
        <section class="page" id="page-datalog">
          <div class="module display">
            <div class="mod-bar"><span>Saved sessions</span><span class="mod-count"><i class="led-a"></i>04 / 05</span></div>
            <div class="lcd">
              <div class="lcd-status"><i class="led-g"></i>Archive</div>
              <h1>Data Log</h1>
              <div class="lcd-sub lcd-date"></div>
            </div>
          </div>
          <div id="datalog-root"></div>
        </section>

        <!-- PAGE 5: ACTIVITY -->
        <section class="page" id="page-activity">
          <div class="module display">
            <div class="mod-bar"><span>Gym calendar</span><span class="mod-count"><i class="led-a"></i>05 / 05</span></div>
            <div class="lcd">
              <div class="lcd-status"><i class="led-g"></i>Calendar</div>
              <h1>Activity</h1>
              <div class="lcd-sub lcd-date"></div>
            </div>
          </div>
          <div id="activity-root"></div>
        </section>

        <!-- NEW PAGES GO HERE LATER -->

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/presets.js"></script>
  <script src="js/pages/workout.js"></script>
  <script src="js/pages/progress.js"></script>
  <script src="js/pages/datalog.js"></script>
  <script src="js/pages/activity.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync.js"></script>

</body>
</html>
